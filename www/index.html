<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">        
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <title>Közös Rajzolás</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>

        <nav class="navbar md:navbar-expand bg-1 mb-8">
            <div class="container-fluid">
                <div id="brand-icon" class="navbar-brand">
                    <img src="favicon.svg" width="56px">
                </div>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body mb-2 md:mb-0">
                        <ul class="nav navbar-nav me-auto">
                            <li class="item">
                                <a class="nav-link active" aria-current="page" href="https://youtu.be/dQw4w9WgXcQ">Home</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>

        <section id="main" class="container">
            <div class="card mx-auto">
                <div class="card-body">
                    <div class="container-fluid d-flex justify-content-around">
                        <input class="form-control w-3" type="color" id="color-picker" value="#ff0000">    
                        <input class="form-control w-6" type="number" id="size-picker" value=10>
                    </div>
                </div>
                <canvas style="touch-action: none;" class="card-img-bottom" id="drawing-screen" width="1280" height="720"></canvas>
            </div>
        <section id="main" class="container">
        
        <audio id="lovely-song" src="song<3.mp3"></audio>
        <script>
            document.getElementById('brand-icon').addEventListener('click', function() {
                document.getElementById('lovely-song').play();
            });
        </script>
        <script type="module" src="drawingscreen.js"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
